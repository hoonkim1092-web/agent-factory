[pytest]
addopts = --ignore=artifacts/pytest_tmp_2 --ignore=.pytest_tmp --ignore=.tmp_smoke_projects --ignore=runs --ignore-glob=af-test-* --ignore-glob=af_*_smoke_* --ignore-glob=tmp_*_smoke* -p no:cacheprovider -p no:tmpdir
norecursedirs = .git .venv .pytest_tmp .tmp_smoke_projects artifacts/pytest_tmp_2 tmp_pytest_probe runs af-test-* af_*_smoke_* tmp_*_smoke* projects test-projects .af_runtime
markers =
    slow: 실제 외부 바이너리(nlm 등)를 호출하는 통합 테스트. CI 주기 실행 전용 — `pytest -m slow`
    e2e: 합성 파이프라인 시뮬레이션 테스트. 느리므로 명시 실행 전용 — `pytest -m e2e`
