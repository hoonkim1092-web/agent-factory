# Agent Factory destructive command guard
# Blocks delete/reset shell commands while keeping normal edits available.

[[rules]]
description = "Block rm"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "rm"

[[rules]]
description = "Block del"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "del"

[[rules]]
description = "Block erase"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "erase"

[[rules]]
description = "Block Remove-Item"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "Remove-Item"

[[rules]]
description = "Block cmd del"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "cmd"

[[rules.matchers]]
field = "argsPattern"
pattern = """(^|\s)/c\s+del(\s|$)"""

[[rules]]
description = "Block powershell Remove-Item"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "powershell"

[[rules.matchers]]
field = "argsPattern"
pattern = """(^|\s)-Command\s+Remove-Item(\s|$)"""

[[rules]]
description = "Block pwsh Remove-Item"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "pwsh"

[[rules.matchers]]
field = "argsPattern"
pattern = """(^|\s)-Command\s+Remove-Item(\s|$)"""

[[rules]]
description = "Block git clean"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "git"

[[rules.matchers]]
field = "argsPattern"
pattern = """(^|\s)clean(\s|$)"""

[[rules]]
description = "Block git reset --hard"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "git"

[[rules.matchers]]
field = "argsPattern"
pattern = """(^|\s)reset(\s|$).*--hard"""

[[rules]]
description = "Block git checkout --"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "git"

[[rules.matchers]]
field = "argsPattern"
pattern = """(^|\s)checkout(\s|$).*--"""

[[rules]]
description = "Block git restore --worktree"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "git"

[[rules.matchers]]
field = "argsPattern"
pattern = """(^|\s)restore(\s|$).*--worktree"""

[[rules]]
description = "Block git restore --staged"
include_tools = ["run_shell_command"]
decision = "deny"

[[rules.matchers]]
field = "commandPrefix"
pattern = "git"

[[rules.matchers]]
field = "argsPattern"
pattern = """(^|\s)restore(\s|$).*--staged"""
