name: V2.0 Factory CI Baseline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov black mypy pydantic pydantic-settings

      # The repository has a large pre-existing Black backlog. Keep the audit
      # visible while CI recovery work proceeds, but do not prevent type/tests
      # from running solely because legacy files have not yet been reformatted.
      - name: Legacy formatting audit (non-blocking)
        continue-on-error: true
        run: |
          black --check --target-version py310 config core utils

      - name: Static Type Checking (MyPy)
        run: |
          mypy core/ config/ utils/ --ignore-missing-imports

      - name: Run Tests
        run: |
          python -m pytest -m "not slow and not e2e" -q
