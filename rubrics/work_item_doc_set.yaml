name: "Work-Item Document Set Quality"
artifact_types:
  - work_item_doc_set

dimensions:

  - name: completeness
    description: "4종 문서(feature-plan, feature-spec, implementation-tasks, approval-gate) 모두 존재하고 본문이 충분"
    weight: 0.25
    levels:
      5: "4종 모두 존재 + 각 본문 ≥ 200자"
      3: "4종 중 1개 빠짐 또는 본문 < 200자 1건"
      1: "4종 중 2개 이상 빠짐"
    evidence_checks:
      - field: "documents"
        rule: "doc_set_present"
        value: ["feature-plan.md", "feature-spec.md", "implementation-tasks.md", "approval-gate.md"]
        description: "4종 필수 문서가 모두 존재하고 본문이 비어있지 않아야 함"

  - name: requirements_mapping
    description: "feature-spec의 acceptance_criteria가 project_brief deliverables를 커버하는 비율"
    weight: 0.30
    levels:
      5: "project_brief.deliverables 키워드 ≥ 80% 커버"
      3: "≥ 60% 커버"
      1: "< 60% 커버"
    evidence_checks:
      - field: "documents.feature-spec.md"
        rule: "covers_deliverables"
        value: 0.6
        description: "project_brief.deliverables의 키워드가 feature-spec 본문에 등장하는 비율 ≥ 60%"

  - name: edge_cases
    description: "feature-spec에 예외/실패/엣지 케이스가 명시되어 있는지"
    weight: 0.20
    levels:
      5: "edge/error/risk 관련 키워드 ≥ 3건 또는 명시적 risks 섹션"
      3: "1~2건"
      1: "0건"
    evidence_checks:
      - field: "documents.feature-spec.md"
        rule: "keyword_count_min"
        value: 3
        keywords: ["엣지", "예외", "실패", "edge", "error", "risk", "risks"]
        description: "edge/error/risk 관련 키워드 ≥ 3건"

  - name: consistency
    description: "feature-plan과 feature-spec의 phase/section 수가 일치하는지"
    weight: 0.15
    levels:
      5: "phase 수 차이 ≤ 1"
      3: "차이 ≤ 3"
      1: "차이 ≥ 4"
    evidence_checks:
      - field: "documents"
        rule: "phase_count_match"
        tolerance: 1
        description: "feature-plan과 feature-spec의 Phase 섹션 수 차이 ≤ 1"

  - name: traceability
    description: "implementation-tasks의 task들이 feature-spec 섹션 번호(§N)를 참조하는 비율"
    weight: 0.10
    levels:
      5: "≥ 60% task가 §N 참조"
      3: "≥ 30%"
      1: "< 30%"
    evidence_checks:
      - field: "documents.implementation-tasks.md"
        rule: "task_section_ref_ratio"
        threshold: 0.3
        description: "task 목록 중 §N 참조 비율 ≥ 30%"

thresholds:
  pass: 4.0
  pass_with_warnings: 3.0

scoring:
  method: "weighted_average"
  min_score_per_dimension: 1
  max_score_per_dimension: 5
  normalize_to: 1.0
