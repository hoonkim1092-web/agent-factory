schema_version: 1
question_set_id: goal_clarification

questions:
  - id: goal_summary
    text: "이 프로젝트가 해결하려는 핵심 문제 또는 목표는 무엇입니까?"
    output_field: goal_summary
    required: true
    fallback: null
    default_route: llm_delegate
    block_category_if_missing: missing_required_input

  - id: deployment_target
    text: "배포 대상 환경은 무엇입니까? (예: local, development, staging, production)"
    output_field: deployment_target
    required: true
    fallback: "development"
    default_route: llm_delegate
    block_category_if_missing: missing_required_input

  - id: success_criteria
    text: "이 프로젝트의 성공 기준은 무엇입니까?"
    output_field: success_criteria
    required: false
    fallback: null
    default_route: llm_delegate

  - id: out_of_scope
    text: "이 프로젝트에서 명시적으로 제외할 범위는 무엇입니까?"
    output_field: out_of_scope
    required: false
    fallback: null
    default_route: llm_delegate

  # Q-S2 추가: 테스트 명료화 질문 (INV-Q1: 스킵 → ResearchRouter 합성)
  - id: observable_goal
    text: "다 됐다는 걸 어떻게 눈으로 확인합니까? 관찰 가능한 형태로 알려주세요."
    output_field: observable_goal
    required: false
    fallback: null
    default_route: research_synthesize

  - id: golden_example
    text: "예시 입력 하나와, 그때 기대하는 출력을 알려주세요."
    output_field: golden_example
    required: false
    fallback: null
    default_route: research_synthesize

  - id: test_seam
    text: "특수 장비 없이 먹일 수 있는 입력이 있나요? (예: 라이브 마이크 대신 녹음 파일)"
    output_field: test_seam
    required: false
    fallback: null
    default_route: research_synthesize

  - id: manual_only
    text: "자동으로는 못 보고 직접 눈으로 확인해야 하는 부분은?"
    output_field: manual_only
    required: false
    fallback: null
    default_route: research_synthesize
