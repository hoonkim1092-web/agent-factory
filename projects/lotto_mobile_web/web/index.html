<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로또 6/45 번호 추천</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="모바일 웹에서 동작하는 로또 6/45 번호 추천 서비스" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="/api" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/cards.css" />
    <link rel="stylesheet" href="./styles/sliders.css" />
  </head>
  <body>
    <div id="app" class="app-shell" data-status="idle">
      <header class="app-header" role="banner">
        <h1 class="app-title">로또 6/45 추천</h1>
        <p
          class="app-session-status"
          id="session-status"
          aria-live="polite"
          data-testid="session-status"
        >
          대기 중
        </p>
      </header>

      <main class="app-main" role="main">
        <section
          class="panel panel--params"
          aria-labelledby="param-heading"
          data-slot="param-panel"
        >
          <h2 id="param-heading" class="panel-title">추천 파라미터</h2>
          <div id="param-panel-root" class="panel-body"></div>
        </section>

        <section
          class="panel panel--results"
          aria-labelledby="result-heading"
          data-slot="card-list"
        >
          <h2 id="result-heading" class="panel-title">추천 결과</h2>
          <div
            id="offline-banner-root"
            class="banner-slot"
            data-slot="offline-banner"
            hidden
          ></div>
          <div id="card-list-root" class="panel-body">
            <p class="empty-hint" id="empty-hint">
              아래 "추천받기" 버튼을 눌러 조합을 받아보세요.
            </p>
          </div>
        </section>
      </main>

      <footer class="app-footer" role="contentinfo">
        <button
          type="button"
          id="submit-button"
          class="cta-button"
          data-testid="submit-button"
        >
          추천받기
        </button>
      </footer>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
